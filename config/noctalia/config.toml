config_version = 14

[accessibility]
ui_scale = 1.00

# ---------------------------------------------------
# PRACTIS BAR
# ---------------------------------------------------

[bar.default]
start = ["workspaces", "group:sysinfo", "group:active"]
center = ["group:clock_menu"]
end = ["group:media", "group:world", "group:systatus"]

reserve_space = false
smart_auto_hide = true
show_on_workspace_switch = false

thickness = 36
margin_edge = 0
margin_ends = 400
scale = 2
background_opacity = 0.5
ignore_alpha = 0.0


concave_edge_corners = true
radius_top_left = 25
radius_top_right = 25
radius_bottom_left = 25
radius_bottom_right = 25

[[bar.default.capsule_group]]
id = "clock_menu"
members = ["clock_left", "control-center", "clock_right"]
fill = "on_secondary"
border = ""
padding = 10.0
opacity = 1.0

[[bar.default.capsule_group]]
id = "sysinfo"
members = ["sysmon_cpu", "temp", "sysmon_ram",]
fill = "on_secondary"
border = ""
padding = 10.0
opacity = 1.0

[[bar.default.capsule_group]]
id = "world"
members = ["date", "weather"]
fill = "on_secondary"
border = ""
padding = 10.0
opacity = 1.0

[[bar.default.capsule_group]]
id = "systatus"
members = ["network", "volume", "battery", "notifications"]
fill = "on_secondary"
border = ""
padding = 10.0
opacity = 1.0

[[bar.default.capsule_group]]
id = "active"
members = ["active_window"]
fill = "on_secondary"
border = ""
padding = 2.0
opacity = 1.0

[[bar.default.capsule_group]]
id = "media"
members = ["media"]
fill = "on_secondary"
border = ""
padding = 2.0
opacity = 1.0
# ---------------------------------------------------
# SHELL
# ---------------------------------------------------

[shell]
clipboard_image_action_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

# ---------------------------------------------------
# THEME
# ---------------------------------------------------

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4", "qt", "kitty", "btop"]


# ---------------------------------------------------
# WIDGETS
# ---------------------------------------------------

[widget.spacer_1]
type = "spacer"

[widget.workspaces]
capsule = true
capsule_fill = "on_primary"
show_labels = false
active_pill_size = 2.5
inactive_pill_size = 1.0
pill_scale = 0.50

[widget.active_window]
capsule = false
icon_size = 12
min_length = 0
title_scroll = "on_hover"
display = "icon_only"
show_empty_label = false

[widget.clock_left]
type = "clock"
format = "{:%H}"
font_weight = 700
font_scale = 0.5
color = "primary"

[widget.control-center]
custom_image = "/home/gabo/Code/Practis/assets/branding/practis-mono-light.svg"
custom_image_colorize = true
color = "on_surface"
tooltip = "Practis"
scale = 2.0

    [widget.control-center.actions]
    left = "panel-toggle control-center"
    
[widget.clock_right]
type = "clock"
format = "{:%M}"
font_weight = 700
font_scale = 0.5
color = "primary"

[widget.weather]
show_condition = false
show_temperature = true
max_length = 40
color = "primary"
scale = 0.5

[widget.media]
hide_when_no_media = true
album_art_only = true
art_size = 12

[widget.network]
color = "primary"
show_label = false
scale = 0.5

[widget.volume]
color = "primary"
scale = 0.5

[widget.battery]
display_mode = "glyph"
show_label = true
label_content = "time"
hide_when_full = false
color = "primary"
scale = 0.5

[widget.notifications]
color = "primary"
scale = 0.5

[widget.date]
type = "clock"
format = "{:%a %d/%m}"
color = "primary"
scale = 0.5

# ---------- System Monitor ----------

[widget.sysmon_cpu]
type = "sysmon"
stat = "cpu_usage"
glyph = "cpu-2"
color = "primary"
scale = 0.5

[widget.temp]
show_value = false
color = "primary"
scale = 0.5

[widget.sysmon_ram]
type = "sysmon"
stat = "ram_used"
glyph = "memory"
color = "primary"
scale = 0.5

# ---------------------------------------------------
# MONITOR
# ---------------------------------------------------

[system.monitor]
gpu_poll_seconds = 2